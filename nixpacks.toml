[phases.setup]
nixPkgs = ["nodejs_22"]

[variables]
NODE_ENV = "production"
NEXT_TELEMETRY_DISABLED = "1"
HOSTNAME = "0.0.0.0"

[phases.install]
cmds = ["npm ci --legacy-peer-deps"]

[phases.build]
cmds = ["rm -rf .next && npm run build && cp -r public .next/standalone/public && cp -r .next/static .next/standalone/.next/static"]

[start]
cmd = "node .next/standalone/server.js"
